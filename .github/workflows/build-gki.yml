name: build-gki

# Rebuild the liuqin (Xiaomi Pad 6 Pro) stock GKI kernel from the exact ACK
# commit the device runs, using the device's exported running.config, and
# verify KMI compatibility against the full vendor-module CRC baseline.
#
# Everything is pinned:
#   kernel  fb24cf99ad973cd4c7c7fa375c6053f939ef3a89 (5.10.236, android12-9)
#   clang   r416183b  (sha256 d84acd11... as distributed by Google)
#   config  running.config pulled from the device via /proc/config.gz
#
# LTO note: the stock config pins CONFIG_LTO_CLANG_FULL. Full LTO + KASAN +
# CFI routinely exceeds the 16 GB of a free GitHub runner during the vmlinux
# link, so the default here is thin. ThinLTO does not change symbol CRCs
# (genksyms derives them from type signatures), so the KMI contract is
# unaffected. Build with lto=full to reproduce the stock binary shape if you
# have a runner that can survive the link.

on:
  workflow_dispatch:
    inputs:
      lto:
        description: "LTO mode (thin recommended on free runners)"
        type: choice
        default: thin
        options:
          - thin
          - full

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Install pinned Android clang r416183b
        run: |
          curl -sfL \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/6e3223f76384455acde43affde3df0ea9df66c0d/clang-r416183b.tar.gz" \
            -o clang.tar.gz
          echo "d84acd1183f49d25d7d54b4f8b01675a677aa531b53a87cce2c4919ac5ea56a8  clang.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/clang"
          tar -xzf clang.tar.gz -C "$HOME/clang"
          "$HOME/clang/bin/clang" --version

      - name: Checkout pinned ACK common (5.10.236 / android12-9)
        run: |
          git init kernel
          cd kernel
          git config gc.auto 0
          git remote add origin https://android.googlesource.com/kernel/common
          # shallow fetch of one exact commit; fall back to a full branch clone
          if ! git fetch --depth=1 origin fb24cf99ad973cd4c7c7fa375c6053f939ef3a89; then
            echo "shallow fetch rejected; falling back to full branch clone"
            git fetch --no-tags origin android12-5.10
          fi
          git checkout --detach fb24cf99ad973cd4c7c7fa375c6053f939ef3a89
          head -6 Makefile

      - name: Checkout pinned mkbootimg
        run: |
          git clone --depth=1 --branch master-kernel-build-2021 \
            https://android.googlesource.com/platform/system/tools/mkbootimg mkbootimg

      - name: Configure from device running.config
        run: |
          mkdir out
          cp config/running.config out/.config
          if [ "${{ inputs.lto }}" = "thin" ]; then
            ./kernel/scripts/config --file out/.config \
              -d LTO_CLANG_FULL -e LTO_CLANG_THIN
            echo "LTO deviation: THIN (intentional; see workflow header)" | tee lto-note.txt
          else
            echo "LTO: full (stock)" | tee lto-note.txt
          fi
          make -C kernel O="$PWD/out" ARCH=arm64 olddefconfig
          diff -u config/running.config out/.config > config-drift.diff || true
          echo "config drift lines: $(wc -l < config-drift.diff)"
          head -60 config-drift.diff

      - name: Build Image
        run: |
          export PATH="$HOME/clang/bin:$PATH"
          set -o pipefail
          make -j"$(nproc)" -C kernel O="$PWD/out" ARCH=arm64 LLVM=1 Image 2>&1 | tee build.log
          ls -la out/arch/arm64/boot/Image out/Module.symvers

      - name: KMI check against device module baseline
        run: python3 scripts/check-kmi.py out/Module.symvers \
               baseline/symbol-crcs.json --report kmi-report.json

      - name: Pack boot.img with stock header parameters
        run: |
          python3 mkbootimg/mkbootimg.py \
            --header_version 4 \
            --kernel out/arch/arm64/boot/Image \
            --ramdisk packaging/ramdisk-current.cpio.lz4 \
            --os_version 12.0.0 \
            --os_patch_level 2025-09 \
            --output boot-new.img
          sha256sum boot-new.img | tee boot-new.img.sha256
          # round-trip check: unpacked header must match the stock values
          python3 mkbootimg/unpack_bootimg.py --boot_img boot-new.img \
            --out unpack-check | tee unpack-check.log
          ls -la unpack-check

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: liuqin-gki-${{ github.run_id }}
          if-no-files-found: error
          path: |
            boot-new.img
            boot-new.img.sha256
            unpack-check.log
            lto-note.txt
            config-drift.diff
            kmi-report.json
            build.log
            out/arch/arm64/boot/Image
            out/Module.symvers
            out/.config
