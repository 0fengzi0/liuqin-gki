name: build-gki

# Rebuild the liuqin (Xiaomi Pad 6 Pro) stock GKI kernel from the exact ACK
# commit the device runs, using the device's exported running.config, and
# verify KMI compatibility against the full vendor-module CRC baseline.
#
# Everything is pinned:
#   kernel  fb24cf99ad973cd4c7c7fa375c6053f939ef3a89 (5.10.236, android12-9)
#   clang   r416183b  (git-pinned at 6e3223f7..., version-checked 12.0.5)
#   config  running.config pulled from the device via /proc/config.gz
#
# LTO note: the stock config pins CONFIG_LTO_CLANG_FULL. Full LTO + KASAN +
# CFI routinely exceeds the 16 GB of a free GitHub runner during the vmlinux
# link, so the default here is thin. ThinLTO does not change symbol CRCs
# (genksyms derives them from type signatures), so the KMI contract is
# unaffected. Build with lto=full to reproduce the stock binary shape if you
# have a runner that can survive the link.

on:
  workflow_dispatch:
    inputs:
      lto:
        description: "LTO mode (thin recommended on free runners)"
        type: choice
        default: thin
        options:
          - thin
          - full
      profile:
        description: "config profile: stock / perf (UBSAN off, type-neutral) / experiment (KASAN off, expected KMI fail)"
        type: choice
        default: stock
        options:
          - stock
          - perf
          - experiment

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Install pinned Android clang r416183b
        run: |
          # googlesource +archive tarballs are not byte-stable; use git so the
          # pinned commit hash itself guarantees integrity
          git init "$HOME/clang-repo"
          cd "$HOME/clang-repo"
          git remote add origin https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86
          git config core.sparseCheckout true
          mkdir -p .git/info
          echo 'clang-r416183b/' > .git/info/sparse-checkout
          if ! git fetch --depth=1 origin 6e3223f76384455acde43affde3df0ea9df66c0d; then
            echo "sha fetch rejected; falling back to full branch fetch"
            git fetch --no-tags origin master-kernel-build-2021
          fi
          git checkout --detach 6e3223f76384455acde43affde3df0ea9df66c0d
          test "$(git rev-parse HEAD)" = "6e3223f76384455acde43affde3df0ea9df66c0d"
          test -x clang-r416183b/bin/clang
          grep -q '^12\.0\.5$' clang-r416183b/AndroidVersion.txt
          ln -s "$PWD/clang-r416183b" "$HOME/clang"
          "$HOME/clang/bin/clang" --version
          # CROSS_COMPILE prefix supplies the clang --target triple; the gcc
          # binary itself is not invoked under LLVM=1 but must exist for the
          # tool resolution paths
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu

      - name: Checkout pinned ACK common (5.10.236 / android12-9)
        run: |
          git init kernel
          cd kernel
          git config gc.auto 0
          git remote add origin https://android.googlesource.com/kernel/common
          # shallow fetch of one exact commit; fall back to a full branch clone
          if ! git fetch --depth=1 origin fb24cf99ad973cd4c7c7fa375c6053f939ef3a89; then
            echo "shallow fetch rejected; falling back to full branch clone"
            git fetch --no-tags origin android12-5.10
          fi
          git checkout --detach fb24cf99ad973cd4c7c7fa375c6053f939ef3a89
          head -6 Makefile

      - name: Checkout pinned mkbootimg
        run: |
          git init mkbootimg
          cd mkbootimg
          git remote add origin https://android.googlesource.com/platform/system/tools/mkbootimg
          if ! git fetch --depth=1 origin 34bc8bfb493401f7aadbd3b434f9fbfa521e9301; then
            git fetch --no-tags origin master-kernel-build-2021
          fi
          git checkout --detach 34bc8bfb493401f7aadbd3b434f9fbfa521e9301
          test -f mkbootimg.py

      - name: Generate KMI whitelist from device module baseline
        run: |
          mkdir -p out
          # CONFIG_TRIM_UNUSED_KSYMS keeps only exported symbols that are used;
          # the whitelist decides what survives trimming. Xiaomi's device config
          # points at their build machine, so regenerate it from OUR ground
          # truth: every symbol the 353 device modules import or provide.
          python3 - <<'EOF'
          import json
          b = json.load(open('baseline/symbol-crcs.json'))
          syms = set(b['symbols']) | set(b.get('providers', {}))
          with open('out/abi_symbollist.raw', 'w') as f:
              f.write('\n'.join(sorted(syms)) + '\n')
          print(f'whitelist symbols: {len(syms)}')
          EOF

      - name: Configure from device running.config
        run: |
          mkdir -p out
          cp config/running.config out/.config
          # Xiaomi's build-machine path is baked into the device config; point
          # it at the whitelist generated from the module baseline instead
          sed -i "s|^CONFIG_UNUSED_KSYMS_WHITELIST=.*|CONFIG_UNUSED_KSYMS_WHITELIST=\"$PWD/out/abi_symbollist.raw\"|" out/.config
          if [ "${{ inputs.lto }}" = "thin" ]; then
            ./kernel/scripts/config --file out/.config \
              -d LTO_CLANG_FULL -e LTO_CLANG_THIN
            echo "LTO deviation: THIN (intentional; see workflow header)" | tee lto-note.txt
          else
            echo "LTO: full (stock)" | tee lto-note.txt
          fi
          # profile tuning; anything that changes exported type signatures
          # (KASAN, DEBUG_LIST, SCHEDSTATS, ...) is locked by the vendor
          # module CRC contract and must stay at stock values
          case "${{ inputs.profile }}" in
            perf)
              ./kernel/scripts/config --file out/.config -d UBSAN
              echo "profile: perf (UBSAN off; no exported type layout change)" >> lto-note.txt
              ;;
            experiment)
              ./kernel/scripts/config --file out/.config -d KASAN -d UBSAN
              echo "profile: experiment (KASAN+UBSAN off; kmem_cache_* CRCs expected to shift)" >> lto-note.txt
              ;;
            *)
              echo "profile: stock" >> lto-note.txt
              ;;
          esac
          make -C kernel O="$PWD/out" ARCH=arm64 olddefconfig
          diff -u config/running.config out/.config > config-drift.diff || true
          echo "config drift lines: $(wc -l < config-drift.diff)"
          head -60 config-drift.diff

      - name: Build Image
        run: |
          export PATH="$HOME/clang/bin:$PATH"
          set -o pipefail
          # -Wframe-larger-than estimates stack frames at compile time, which
          # differs between thin and full LTO inlining; stock (full LTO) never
          # saw these warnings, so silence just that diagnostic under thin LTO
          make -j"$(nproc)" -C kernel O="$PWD/out" ARCH=arm64 LLVM=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS=-Wno-frame-larger-than= Image 2>&1 | tee build.log
          # modules build runs modpost, which assembles Module.symvers
          # (vmlinux symbol CRC table) — required by the KMI check
          make -j"$(nproc)" -C kernel O="$PWD/out" ARCH=arm64 LLVM=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS=-Wno-frame-larger-than= modules 2>&1 | tee -a build.log
          ls -la out/arch/arm64/boot/Image out/Module.symvers

      - name: KMI check against device module baseline
        run: python3 scripts/check-kmi.py out/Module.symvers baseline/symbol-crcs.json --report kmi-report.json

      - name: Pack boot.img with stock header parameters
        run: |
          python3 mkbootimg/mkbootimg.py \
            --header_version 4 \
            --kernel out/arch/arm64/boot/Image \
            --ramdisk packaging/ramdisk-current.cpio.lz4 \
            --os_version 12.0.0 \
            --os_patch_level 2025-09 \
            --output boot-new.img
          sha256sum boot-new.img | tee boot-new.img.sha256
          # round-trip check: unpacked header must match the stock values
          python3 mkbootimg/unpack_bootimg.py --boot_img boot-new.img \
            --out unpack-check | tee unpack-check.log
          ls -la unpack-check

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: liuqin-gki-${{ github.run_id }}
          if-no-files-found: error
          path: |
            boot-new.img
            boot-new.img.sha256
            unpack-check.log
            lto-note.txt
            config-drift.diff
            kmi-report.json
            build.log
            out/arch/arm64/boot/Image
            out/Module.symvers
            out/.config
